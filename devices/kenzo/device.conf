# DAPify device profile: Xiaomi Redmi Note 3 (kenzo)
#
# This is the verified baseline profile. It targets LineageOS 14.1
# (Android 7.1.2) with CM root and Radon V6.3. Keep values quoted; the file is
# sourced by POSIX shell on both the host and the device.

DAP_DEVICE_CODENAME=kenzo
DAP_DEVICE_NAME="Xiaomi Redmi Note 3"
DAP_DEVICE_ALIASES="kenzo"
DAP_TESTED_ROM="LineageOS 14.1 (Android 7.1.2), CM root, Radon V6.3"
DAP_MIN_SDK=24
DAP_MAX_SDK=28
DAP_ABI="arm64-v8a"

# Apps. These IDs are part of the verified APK build; changing them requires
# rebuilding both apps and updating the native bridge constants.
DAP_PLAYER_PACKAGE="com.sundara.classipod"
DAP_PLAYER_ACTIVITY="com.adeeteya.classipod.MainActivity"
DAP_SETTINGS_PACKAGE="com.sundara.dapsettings"
DAP_SETTINGS_ACTIVITY="com.sundara.dapsettings.SettingsActivity"
DAP_SYSTEMUI_PACKAGE="com.android.systemui"

# Capacitive keys. The source file lives next to this profile.
DAP_KEYLAYOUT_SOURCE="keylayout/Atmel_maXTouch_Touchscreen.kl"
DAP_KEYLAYOUT_TARGET="Atmel_maXTouch_Touchscreen.kl"

# Haptics. The QPNP vibrator accepts an absolute drive voltage; 2800 mV with
# the app's 14 ms wheel pulse gives the verified soft thud. 2500 mV is the
# practical lower bound before the ERM motor stops starting reliably.
DAP_VIBRATOR_DIR="/sys/devices/virtual/timed_output/vibrator"
DAP_HAPTICS_MV=2800
DAP_HAPTICS_MIN_MV=800
DAP_HAPTICS_MAX_MV=3600

# Charge bypass. Use the battery-side suspend vote, never the sibling
# charging_enabled node: that one also cuts the USB input path.
DAP_CHARGE_NODE="/sys/class/power_supply/battery/battery_charging_enabled"
DAP_CHARGE_ONLINE_NODES="usb ac wireless"
DAP_CHARGE_SUSPEND=100
DAP_CHARGE_RESUME=90
DAP_CHARGE_INTERVAL=15

# The init service must run in a domain that can execve /system/bin/sh and
# write the battery node. On this ROM that is qti_init_shell. Set to an empty
# string if the device's init can run the service in the default domain.
DAP_INIT_DOMAIN="qti_init_shell"

# auto = use Magisk when present, otherwise the legacy /system backend.
DAP_ROOT_BACKEND="auto"
