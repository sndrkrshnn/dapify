# DAPify device profile template
#
# Copy this directory to devices/<codename>/ and fill in the values. See
# docs/porting.md for the discovery commands and the verification checklist.
# Keep values quoted; the file is sourced by POSIX shell on host and device.

DAP_DEVICE_CODENAME=CHANGEME
DAP_DEVICE_NAME="Vendor Model"
DAP_DEVICE_ALIASES=""
DAP_TESTED_ROM="LineageOS version / Android version"
DAP_MIN_SDK=24
DAP_MAX_SDK=28
DAP_ABI="arm64-v8a"

DAP_PLAYER_PACKAGE="com.sundara.classipod"
DAP_PLAYER_ACTIVITY="com.adeeteya.classipod.MainActivity"
DAP_SETTINGS_PACKAGE="com.sundara.dapsettings"
DAP_SETTINGS_ACTIVITY="com.sundara.dapsettings.SettingsActivity"
DAP_SYSTEMUI_PACKAGE="com.android.systemui"

# Relative to devices/<codename>/. Set to an empty string if the device has no
# usable capacitive-key remap.
DAP_KEYLAYOUT_SOURCE="keylayout/CHANGEME.kl"
DAP_KEYLAYOUT_TARGET="CHANGEME.kl"

# Audio policy (optional). If the device's wired output only advertises
# 16-bit/48 kHz and you want 44.1 kHz + hi-res (24-bit/192 kHz) playback, point
# this at a patched audio_policy_configuration.xml next to this profile.
#
# To generate one: pull the stock file, patch it, and drop it under
# devices/<codename>/audio/. The stock file is usually at
#   /system/etc/audio_policy_configuration.xml  (older QCOM builds)
# or
#   /vendor/etc/audio_policy_configuration.xml  (system-as-root / sdm845 builds)
# and is selected at boot by ro.audio_policy.file.
#
#   adb pull <stock-path> /tmp/audio_policy_configuration.xml
#   python3 modules/audio/patch_audio_policy.py \
#       /tmp/audio_policy_configuration.xml devices/<codename>/audio/audio_policy_configuration.xml
#
# Set DAP_AUDIO_SOURCE to "audio/audio_policy_configuration.xml" and
# DAP_AUDIO_TARGET to the real path. Leave both empty to skip the audio module.
DAP_AUDIO_SOURCE=""
DAP_AUDIO_TARGET="/system/etc/audio_policy_configuration.xml"

# Find the vibrator node with:
#   adb shell 'ls -l /sys/class/timed_output /sys/devices/virtual/timed_output'
DAP_VIBRATOR_DIR="/sys/devices/virtual/timed_output/vibrator"
DAP_HAPTICS_MV=2800
DAP_HAPTICS_MIN_MV=800
DAP_HAPTICS_MAX_MV=3600

# Find the battery-side charge vote with:
#   adb shell 'ls /sys/class/power_supply/battery'
# Use the battery node, not the USB/charger input node.
DAP_CHARGE_NODE="/sys/class/power_supply/battery/battery_charging_enabled"
DAP_CHARGE_ONLINE_NODES="usb ac wireless"
DAP_CHARGE_SUSPEND=100
DAP_CHARGE_RESUME=90
DAP_CHARGE_INTERVAL=15

# Leave empty if the default init domain can execve /system/bin/sh and write
# the battery node. Otherwise use the domain the ROM already uses for rc
# `exec` commands (check `dmesg | grep avc` after a test boot).
DAP_INIT_DOMAIN=""

DAP_ROOT_BACKEND="auto"
