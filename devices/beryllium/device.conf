# DAPify device profile: Xiaomi POCO F1 (beryllium)
#
# STATUS: UNVERIFIED / best-effort port.
#
# This profile was written from the LineageOS beryllium + sdm845-common device
# trees (lineage-16.0) and public hardware notes; it has NOT been run on a real
# POCO F1. The values below that are confirmed by the device tree are marked
# (confirmed); the ones that must be confirmed on-device before trusting the
# profile are marked (VERIFY) with the exact probe command.
#
# POCO F1 = Snapdragon 845 (SDM845), arm64, 3.5 mm TRRS jack. LineageOS 16.0+
# is system-as-root + dm-verity, so /system is read-only: use the Magisk
# backend (DAP_ROOT_BACKEND=auto already picks it when Magisk is present).

DAP_DEVICE_CODENAME=beryllium
DAP_DEVICE_NAME="Xiaomi POCO F1"
DAP_DEVICE_ALIASES="beryllium"
DAP_TESTED_ROM="LineageOS 16.0+ (Android 9/10+), Magisk root — UNVERIFIED"
# SDM845 is arm64, so the arm64 player APK is fine. LOS 16.0 is API 28+; allow
# a wide range since the exact target depends on the installed LOS build.
DAP_MIN_SDK=28
DAP_MAX_SDK=34
DAP_ABI="arm64-v8a"

DAP_PLAYER_PACKAGE="com.sundara.classipod"
DAP_PLAYER_ACTIVITY="com.adeeteya.classipod.MainActivity"
DAP_SETTINGS_PACKAGE="com.sundara.dapsettings"
DAP_SETTINGS_ACTIVITY="com.sundara.dapsettings.SettingsActivity"
# confirmed: standard AOSP SystemUI (overlay at frameworks/base/packages/SystemUI)
DAP_SYSTEMUI_PACKAGE="com.android.systemui"

# Keylayout (confirmed): POCO F1 has NO capacitive nav keys. Navigation is
# gesture/soft-nav plus a single physical HOME button on the bottom bezel,
# mapped in keylayout/gpio-keys.kl (key 102 -> HOME), and a REAR Goodix
# fingerprint sensor. There is nothing to remap for the DAP home/transport
# model, so no keylayout is shipped.
#
# If you want the physical HOME button (Linux keycode 102) to act as
# play/pause instead, enable a keylayout that remaps it. The stock file is
# keylayout/gpio-keys.kl; copy it and change only the `key 102` line. Until
# that is verified on-device we leave this empty (safe default).
DAP_KEYLAYOUT_SOURCE=""
DAP_KEYLAYOUT_TARGET=""

# Haptics (VERIFY): the device tree ships the AOSP vibrator@1.0 HIDL HAL with
# no custom driver, which implies the generic Linux timed_output node. The
# default below matches the kenzo QPNP path. Confirm the real node and whether
# it is a rotating ERM (vtg_level) or an LRA (amplitude/time_ms) at boot:
#   adb shell 'ls /sys/class/timed_output/vibrator/'
#   adb shell su -c 'sh -c "cat /sys/class/timed_output/vibrator/vtg_level 2>/dev/null; cat /sys/class/timed_output/vibrator/amplitude 2>/dev/null"'
DAP_VIBRATOR_DIR="/sys/class/timed_output/vibrator"
DAP_HAPTICS_MV=2800
DAP_HAPTICS_MIN_MV=800
DAP_HAPTICS_MAX_MV=3600

# Charge bypass (VERIFY): the device tree does not name a charge-suspend node.
# On SDM845 the battery is under /sys/class/power_supply/battery. Confirm the
# exact node name and that it is the BATTERY-side vote (not the USB/charger
# input node, which cuts the input path) before relying on it:
#   adb shell 'ls /sys/class/power_supply/battery/'
#   adb shell su -c 'sh -c "for f in /sys/class/power_supply/battery/*; do echo \"$f: \$(cat $f 2>/dev/null)\"; done"'
DAP_CHARGE_NODE="/sys/class/power_supply/battery/battery_charging_enabled"
DAP_CHARGE_ONLINE_NODES="usb ac wireless"
DAP_CHARGE_SUSPEND=100
DAP_CHARGE_RESUME=90
DAP_CHARGE_INTERVAL=15

# Init domain (confirmed-ish): standard AOSP init; no qti_init_shell grant is
# used by the beryllium tree. Because /system is read-only the system backend
# will not work — the Magisk backend is required, which runs the charge daemon
# from service.sh and does not need an init domain. Leave empty.
DAP_INIT_DOMAIN=""

# Audio policy (confirmed need, patch unverified): the stock
# audio_policy_configuration.xml on beryllium lives in /vendor/etc/ (inherited
# from sdm845-common) and its wired device ports advertise only 16-bit/48 kHz;
# the 24-bit/192 kHz profiles are only on the direct_pcm mix port. The patch
# below is generated from the stock /vendor/etc file via
# modules/audio/patch_audio_policy.py.
#
# NOTE: the target is /vendor/etc/, NOT /system/etc/ as on kenzo. On
# system-as-root + dm-verity builds /vendor is also read-only, so this is
# installed by the Magisk backend (overlay). Verify the path at boot:
#   adb shell 'ls -l /vendor/etc/audio_policy_configuration.xml /system/etc/audio_policy_configuration.xml 2>&1'
# and set DAP_AUDIO_TARGET to whichever exists (on some LOS builds it is
# /system/etc). The shipped patch is verified to patch the stock file cleanly
# and idempotently; the on-device audio result (24-bit/192 via a direct-output
# player) still needs a real listen-test.
DAP_AUDIO_SOURCE="audio/audio_policy_configuration.xml"
DAP_AUDIO_TARGET="/vendor/etc/audio_policy_configuration.xml"

# Magisk is required on this device (read-only /system). auto would also pick
# magisk when present; force it to avoid a confusing system-backend failure.
DAP_ROOT_BACKEND="magisk"
